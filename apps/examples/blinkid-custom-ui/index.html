<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlinkID Custom UI Example</title>
  </head>
  <body>
    <main>
      <h1>BlinkID custom UI example</h1>
      <p>The app supplies this interface. The UX Manager supplies scanning orchestration.</p>

      <div class="controls">
        <button id="load-sdk" disabled>Load SDK</button>
        <button id="start" disabled>Start scanning</button>
        <button id="retry" hidden>Retry</button>
        <button id="stop" disabled>Stop</button>
        <button id="destroy-sdk" disabled>Destroy SDK</button>
      </div>

      <p id="status" role="status" aria-live="polite">Loading SDK resources…</p>
      <p id="error" class="error" role="alert" hidden></p>

      <div id="reticle" class="reticle" data-reticle="searching">
        <video id="video" aria-label="Camera stream" playsinline muted></video>
      </div>

      <pre id="result" aria-label="Scan result"></pre>
    </main>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
