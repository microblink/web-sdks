packages:
  - apps/examples/*
  - packages/*

catalogs:
  oxc:
    oxfmt: "0.61.0"
    oxlint: "1.76.0"
    oxlint-tsgolint: "7.0.2001"
  publish:
    "@arethetypeswrong/cli": 0.18.5
    publint: ^0.3.12
    typedoc-plugin-markdown: ^4.12.0
    write-package: ^7.1.0
  test:
    "@vitest/browser-playwright": "5.0.0"
    "@vitest/coverage-v8": "5.0.0"
    "happy-dom": "20.11.2"
    playwright: ^1.62.1
    vitest: "5.0.0"
  typescript:
    "@microsoft/api-extractor": "7.58.12"
    "@typescript/native": npm:typescript@7.0.2
    typedoc: 0.28.20
    typescript: npm:@typescript/typescript6@6.0.2
    tsx: ^4.21.0
  ui:
    "@ark-ui/solid": ^5.38.1
    "@solid-primitives/keyed": ^1.5.3
    "@solid-primitives/resize-observer": ^2.2.0
    sass: ^1.85.0
    solid-js: ^1.9.14
    solid-motionone: ^1.0.4
    solid-zustand: ^2.0.0
    unocss: ^66.7.5
    zustand: ^5.0.14
  utils:
    common-tags: ^1.8.2
    dotenv-cli: ^8.0.0
    rimraf: ^6.1.3
    zx: ^8.8.5
  vite:
    vite: "8.2.0"
    vite-plugin-css-injected-by-js: ^5.0.2
    vite-plugin-externalize-dependencies: 1.0.1
    vite-plugin-mkcert: ^2.1.0
    vite-plugin-qrcode: ^0.4.1
    vite-plugin-solid: ^2.11.14
    vite-plugin-solid-svg: 0.8.1

allowBuilds:
  "@bufbuild/buf": true
  "@parcel/watcher": true
  esbuild: true
  lefthook: true
  msw: true

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

publicHoistPattern:
  - "*types*"
  - "*plugin*"

catalog:
  "@types/common-tags": ^1.8.3
  "@types/node": ^25.2.3
  clsx: ^2.1.1
  comlink: ^4.4.2
  merge-anything: ^6.0.3
  perfect-debounce: ^2.1.0
  ts-pattern: ^5.6.2
  type-fest: ^4.35.0
  yy-fps: ^2.0.1

overrides:
  "@babel/runtime@7": 7.29.7
  "brace-expansion@1": 1.1.18
  fast-uri: 3.1.5
  flatted: 3.4.4
  "immutable@5": 5.1.9
  "js-yaml@3": 3.15.1
  "js-yaml@4": 4.3.1
  "minimatch@3": 3.1.4
  "nanoid@3": 3.3.17
  "picomatch@2": 2.3.2
  "vite-plugin-solid-svg>svgo": 3.3.4
minimumReleaseAgeExclude:
  # Renovate security update: browserslist@4.28.7
  - browserslist@4.28.7
